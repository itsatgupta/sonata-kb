services:
  - type: web
    name: sonata-voice-poc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONFLUENCE_PAT
        sync: false
      - key: JIRA_PAT
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
